# Test-only, never shipped (GKM-025, MAIL-050). A minimal iOS app that hosts the Mail kit's
# WebKit tests on the simulator. Package tests on iOS run in an unhosted `xctest` process,
# where WebKit's helper processes have no app to belong to and stall; inside an app they run
# as they will in GitKittie Mail for iPhone. macOS runs the same tests in `swift test`.
#
#   cd swift/GitKittieMailKit/TestHost && xcodegen generate
#   xcodebuild -project MailKitTestHost.xcodeproj -scheme MailKitHostedTests \
#     -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' test
name: MailKitTestHost
options:
  bundleIdPrefix: app.hakobs.gitmail.testhost
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    # The package's tests are Swift 5 language mode (tools 5.9); the same sources build here.
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  GitKittieMailKit:
    path: ..

targets:
  MailKitTestHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitmail.testhost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1

  # The WebKit-dependent tests, from the package's own test sources, hosted in the app.
  MailKitHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/MailReaderTests/WebViewSafetyTests.swift
    dependencies:
      - target: MailKitTestHost
      - package: GitKittieMailKit
        product: MailCore
      - package: GitKittieMailKit
        product: MailHTML
      - package: GitKittieMailKit
        product: MailMIME
      - package: GitKittieMailKit
        product: MailStore
      - package: GitKittieMailKit
        product: MailReader
      - package: GitKittieMailKit
        product: MailReaderWeb
      - package: GitKittieMailKit
        product: MailTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitmail.testhost.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MailKitTestHost.app/MailKitTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MailKitHostedTests:
    build:
      targets:
        MailKitTestHost: all
        MailKitHostedTests: [test]
    test:
      config: Debug
      targets:
        - MailKitHostedTests
