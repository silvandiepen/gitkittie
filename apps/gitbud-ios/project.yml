name: GitBud
options:
  bundleIdPrefix: app.hakobs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "38MGF83L2L"

packages:
  # Every git host, through GitPont only (repo rule). Pinned to a revision of master (the
  # merge of git-pont#7) rather than following the branch, so a build is reproducible; move
  # the pin on purpose when GitPont gains something this app needs (see GITKIT-106).
  git-pont:
    url: https://github.com/silvandiepen/git-pont.git
    revision: 6c0ffa99ad31cc8f112c585455101529e9be5085
  # Diff layout, choosing lines, patches, the line merge, on-device Magic.
  GitKittieKit:
    path: ../../swift/GitKittieKit

targets:
  GitBud:
    type: application
    platform: iOS
    sources:
      - path: GitBud
      # The colours and the "Update available" notice every GitKittie app shares.
      - path: ../../swift/GitKittieUI
    dependencies:
      # "Update available" (swift/GitKittieUI/UpdateNotice.swift, GITKITTIE-094).
      - package: GitKittieKit
        product: AppStoreUpdates
      - package: git-pont
        product: GitPontCore
      - package: git-pont
        product: GitPontGitHub
      - package: git-pont
        product: GitPontGitLab
      - package: GitKittieKit
        product: GitKittieKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitbud
        INFOPLIST_FILE: GitBud/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: GitBud/Info.plist
      properties:
        CFBundleDisplayName: Bud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  GitBudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GitBud
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitBud.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GitBud"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GitBudUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GitBud
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: GitBud

schemes:
  GitBud:
    build:
      targets:
        GitBud: all
        GitBudTests: [test]
        GitBudUITests: [test]
    test:
      targets:
        - GitBudTests
        - GitBudUITests
