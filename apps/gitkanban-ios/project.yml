name: GitKanban
options:
  bundleIdPrefix: app.hakobs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: 9
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "38MGF83L2L"

packages:
  # Provider REST transport types used by the UI (GitRepository, OAuth session).
  git-pont:
    url: https://github.com/silvandiepen/git-pont.git
    branch: master
  # The shared board model + parsers (mirrors @gitkittie/gitkanban-core).
  GitKittieKit:
    path: ../../swift/GitKittieKit
  # The shared GitKanban app layer (AppModel + provider transport), tested once.
  GitKanbanKit:
    path: ../../swift/GitKanbanKit

targets:
  GitKanban:
    type: application
    platform: iOS
    sources:
      - path: GitKanban
      # Views both apps draw the same way (the rendered Markdown page).
      - path: ../../swift/TasksUI
      # The colours and the "Update available" notice every GitKittie app shares.
      - path: ../../swift/GitKittieUI
      # The rendered, editable Markdown view's web runtime (from Lezin), kept as a folder.
      - path: ../../swift/RichEditorWeb
        type: folder
        buildPhase: resources
      # Image markup and task drafting, also compiled into the share and action extensions.
      - path: Shared
    dependencies:
      # "Update available" (swift/GitKittieUI/UpdateNotice.swift, GITKITTIE-094).
      - package: GitKittieKit
        product: AppStoreUpdates
      - package: GitKanbanKit
        product: GitKanbanKit
      - package: git-pont
        product: GitPontCore
      - package: GitKittieKit
        product: GitKittieKit
      # "Tasks" in the share sheet: a screenshot becomes a card (see ShareExtension/).
      - target: GitKanbanShare
      # The same sheet as an action: "Add to Tasks" in the share sheet's action list.
      - target: GitKanbanAction
    # The App Group is how the app and the share extension see the same boards,
    # connection and token (GitKanbanSharedStorage in GitKanbanKit).
    entitlements:
      path: GitKanban/GitKanban.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.hakobs.gitkanban
        # Instant review notifications through the relay (apps/gitkanban-relay/docs/Push.md).
        # Xcode signs App Store and TestFlight builds with "production" from the profile.
        aps-environment: development
        # A review request marked `notify: urgent` breaks through Focus.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitkanban
        INFOPLIST_FILE: GitKanban/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: GitKanban/Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Folder servers on the local network (http://my-mac.local:4417) or loopback in
        # the simulator. Tailscale serve URLs are HTTPS and don't need this.
        NSLocalNetworkUsageDescription: GitKanban looks for folder servers on your Mac so you can add one without typing its address.
        NSBonjourServices:
          - _gitkanban._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # `gitkittie-tasks://new?title=…&body=…` starts a new task (GitKittie Mail's Make Task,
        # GKM-033). It only fills in the new-task sheet; nothing is saved without Create.
        CFBundleURLTypes:
          - CFBundleURLName: app.hakobs.gitkanban.new-task
            CFBundleURLSchemes:
              - gitkittie-tasks
        # Sending the outbox when the app is woken in the background (GitKanbanApp), and
        # catching up after a review push.
        UIBackgroundModes:
          - fetch
          # A review push wakes the app to catch up its inbox and badge (silent requests).
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - app.hakobs.gitkanban.sync
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  GitKanbanShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
      # Board colours, the same as on the home screen (the board panel).
      - path: ../../swift/TasksUI/BoardColor.swift
      # The screenshot markup editor, the same in the app and on the Mac.
      - path: ../../swift/TasksUI/ImageMarkupEditor.swift
    dependencies:
      - package: GitKanbanKit
        product: GitKanbanKit
      - package: GitKittieKit
        product: GitKittieKit
    entitlements:
      path: ShareExtension/GitKanbanShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.hakobs.gitkanban
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitkanban.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Plain-HTTP folder servers on the local network, same as the app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            # Offer Tasks whenever at least one shared attachment is an image, even when
            # the sharing app adds other representations (a URL, text) alongside it. The
            # plain "SupportsImageWithMaxCount" rule hides the target in that case.
            # Some apps share an image without typing it as one: a file whose name has no
            # image extension registers only "dyn.…" + "public.file-url", and an item source
            # can declare plain "public.data". Those attachments count too, unless they also
            # say they are something else (text, a PDF, a web link); the extension checks the
            # bytes (TaskImage). Keep GitKanbanAction's rule the same.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item,
              SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              OR (SUBQUERY($attachment.registeredTypeIdentifiers, $type,
              $type == "public.data" OR $type BEGINSWITH "dyn.").@count >= 1
              AND SUBQUERY($attachment.registeredTypeIdentifiers, $type,
              $type UTI-CONFORMS-TO "public.content"
              OR ($type UTI-CONFORMS-TO "public.url" AND NOT $type UTI-CONFORMS-TO "public.file-url")).@count == 0)
              ).@count >= 1).@count >= 1

  # The share sheet has two places: the row of app icons (GitKanbanShare) and the list of
  # actions below it, where people look for "Ask …" / "Save to …". This is the same view
  # controller registered as an action, so Tasks is in both.
  GitKanbanAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ActionExtension
      - path: Shared
      - path: ../../swift/TasksUI/BoardColor.swift
      - path: ../../swift/TasksUI/ImageMarkupEditor.swift
    dependencies:
      - package: GitKanbanKit
        product: GitKanbanKit
      - package: GitKittieKit
        product: GitKittieKit
    entitlements:
      path: ActionExtension/GitKanbanAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.hakobs.gitkanban
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitkanban.action
        INFOPLIST_FILE: ActionExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        # The action's icon in the list: the Tasks mark, used as a template image.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ActionExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to Tasks
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionServiceAllowsFinderPreviewItem: false
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item,
              SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              OR (SUBQUERY($attachment.registeredTypeIdentifiers, $type,
              $type == "public.data" OR $type BEGINSWITH "dyn.").@count >= 1
              AND SUBQUERY($attachment.registeredTypeIdentifiers, $type,
              $type UTI-CONFORMS-TO "public.content"
              OR ($type UTI-CONFORMS-TO "public.url" AND NOT $type UTI-CONFORMS-TO "public.file-url")).@count == 0)
              ).@count >= 1).@count >= 1

  GitKanbanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GitKanban
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  GitKanbanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GitKanban
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: GitKanban
