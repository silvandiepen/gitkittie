name: GitMail
options:
  bundleIdPrefix: app.hakobs
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "38MGF83L2L"

packages:
  # AppStoreUpdates only: the App Store lookup behind "Update available" (GITKITTIE-094).
  GitKittieKit:
    path: ../../swift/GitKittieKit
  # The UI-independent mail core: models, the store, the classifier (MAIL-015).
  GitKittieMailKit:
    path: ../../swift/GitKittieMailKit
  # The provider adapters, the outbox (MAIL-017; GKM-014), account setup and sync (GKM-010, GKM-011).
  GitKittieMailProviders:
    path: ../../swift/GitKittieMailProviders

targets:
  GitMail:
    type: application
    platform: macOS
    sources:
      - path: GitMail
      # The UI-free app model (AppModel, the browser, accounts, sending, spaces, …), shared
      # with the iPhone and iPad app (GKM-027, MAIL-067).
      - path: ../../swift/MailAppModel
      # The colours and the "Update available" notice every GitKittie app shares.
      - path: ../../swift/GitKittieUI
    dependencies:
      # "Update available" (swift/GitKittieUI/UpdateNotice.swift, GITKITTIE-094).
      - package: GitKittieKit
        product: AppStoreUpdates
      - package: GitKittieMailKit
        product: MailCore
      - package: GitKittieMailKit
        product: MailStore
      # Purpose, risk and urgency, and the category views (GKM-017, GKM-018).
      - package: GitKittieMailKit
        product: MailClassifier
      - package: GitKittieMailKit
        product: MailMIME
      - package: GitKittieMailKit
        product: MailCompose
      - package: GitKittieMailProviders
        product: MailProvider
      - package: GitKittieMailProviders
        product: MailOutbox
      # The safe reader and search (GKM-012, GKM-016).
      - package: GitKittieMailKit
        product: MailHTML
      - package: GitKittieMailKit
        product: MailReader
      - package: GitKittieMailKit
        product: MailReaderWeb
      - package: GitKittieMailKit
        product: MailExtraction
      # Attachment text for search runs in this sandboxed helper, never in the app (ThreatModel §4).
      - target: GitMailExtractor
      - package: GitKittieMailProviders
        product: MailAccounts
      - package: GitKittieMailProviders
        product: MailSync
      # Which unsubscribe to offer, and the one approved RFC 8058 request (GKM-020).
      - package: GitKittieMailKit
        product: MailUnsubscribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitmail
        # The app is Mail.app and shows as "Mail" in the Dock, menu bar and Finder, as Tasks shows as
        # "Tasks"; GitKittie Mail is the product's name on the site and in the App Store. The Swift
        # module keeps its GitMail name so imports and tests do not change.
        PRODUCT_NAME: Mail
        PRODUCT_MODULE_NAME: GitMail
        # Icon source: project-assets GitKittie/assets/icon_gitmail.svg (the family's construction,
        # lavender field); the PNGs in AppIcon.appiconset are rendered from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GitMail/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitMail/GitMail.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: GitMail/GitMail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # IMAP and SMTP over TLS (GKM-010, GKM-011).
        com.apple.security.network.client: true
        # Account passwords and tokens, in this app's own keychain group (GKM-010).
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.hakobs.gitmail
        # Files and folders the person picks: File ▸ Import Messages… reads .eml files (GKM-012);
        # a chosen mail folder, remembered across launches (MAIL-021, GKM-010), and the folder an
        # account's mail is exported to when it is removed, are written. Read-write covers both.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: GitMail/Info.plist
      properties:
        CFBundleDisplayName: Mail
        CFBundleName: Mail
        # `gitkittie-mail://message/<account>/<key>` opens that message: the stable link a
        # Tasks card made with Make Task carries back (GKM-033, MAIL-131).
        CFBundleURLTypes:
          - CFBundleURLName: app.hakobs.gitmail.message
            CFBundleURLSchemes:
              - gitkittie-mail
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © Sil van Diepen"

  # Extracts text from PDF and plain-text attachments for search (GKM-016). Its own process,
  # sandboxed with no entitlements at all: no network, no files; bytes in, text out over XPC,
  # and a watchdog ends it if one document takes too long (ThreatModel §4, MAIL-031).
  GitMailExtractor:
    type: xpc-service
    platform: macOS
    sources:
      - path: GitMailExtractor
    dependencies:
      - package: GitKittieMailKit
        product: MailExtraction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitmail.extractor
        PRODUCT_NAME: GitMailExtractor
        INFOPLIST_FILE: GitMailExtractor/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitMailExtractor/GitMailExtractor.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    entitlements:
      path: GitMailExtractor/GitMailExtractor.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: GitMailExtractor/Info.plist
      properties:
        CFBundleDisplayName: GitKittie Mail Extractor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        XPCService:
          ServiceType: Application

  # The app model against a real store in a temporary folder. The model's sources are built
  # into the bundle, so the tests run without launching the app.
  GitMailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../../swift/MailAppModel
      - path: Tests
      # The local GreenMail helper the iPhone app's tests share.
      - path: ../../swift/MailAppTestSupport
      # The recording HTTP server the unsubscribe tests share with the mail core's.
      - path: ../../swift/GitKittieMailKit/Tests/MailUnsubscribeTests/RecordingHTTPServer.swift
      # The shared theme and its Increase Contrast tests (GKM-063), compiled here as the app does.
      - path: ../../swift/GitKittieUI/Theme.swift
      - path: ../../swift/GitKittieUITests
    dependencies:
      - package: GitKittieMailKit
        product: MailCore
      - package: GitKittieMailKit
        product: MailStore
      # Purpose, risk and urgency, and the category views (GKM-017, GKM-018).
      - package: GitKittieMailKit
        product: MailClassifier
      - package: GitKittieMailKit
        product: MailMIME
      - package: GitKittieMailKit
        product: MailCompose
      - package: GitKittieMailProviders
        product: MailProvider
      - package: GitKittieMailProviders
        product: MailOutbox
      - package: GitKittieMailKit
        product: MailHTML
      - package: GitKittieMailKit
        product: MailReader
      - package: GitKittieMailKit
        product: MailExtraction
      - package: GitKittieMailProviders
        product: MailAccounts
      - package: GitKittieMailProviders
        product: MailSync
      - package: GitKittieMailKit
        product: MailUnsubscribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitmail.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  GitMail:
    build:
      targets:
        GitMail: all
        GitMailTests: [test]
    test:
      targets:
        - GitMailTests
