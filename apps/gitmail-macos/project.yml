name: GitMail
options:
  bundleIdPrefix: app.hakobs
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "38MGF83L2L"

packages:
  # The UI-independent mail core: models, the store, the classifier (MAIL-015).
  GitKittieMailKit:
    path: ../../swift/GitKittieMailKit
  # The provider adapters and the outbox (MAIL-017; GKM-014).
  GitKittieMailProviders:
    path: ../../swift/GitKittieMailProviders

targets:
  GitMail:
    type: application
    platform: macOS
    sources:
      - path: GitMail
      # The colours every GitKittie app shares.
      - path: ../../swift/GitKittieUI
    dependencies:
      - package: GitKittieMailKit
        product: MailCore
      - package: GitKittieMailKit
        product: MailStore
      - package: GitKittieMailKit
        product: MailMIME
      - package: GitKittieMailKit
        product: MailCompose
      - package: GitKittieMailProviders
        product: MailProvider
      - package: GitKittieMailProviders
        product: MailOutbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitmail
        # The bundle is GitMail.app; people see "GitKittie Mail" (CFBundleDisplayName), as with GitBud.
        # No AppIcon yet: the Mail icon is still to be designed (same as GitBud). Add the
        # AppIcon set to Assets.xcassets and ASSETCATALOG_COMPILER_APPICON_NAME together.
        INFOPLIST_FILE: GitMail/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitMail/GitMail.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: GitMail/GitMail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # IMAP and SMTP over TLS (GKM-010, GKM-011).
        com.apple.security.network.client: true
        # Account passwords and tokens, in this app's own keychain group (GKM-010).
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.hakobs.gitmail
    info:
      path: GitMail/Info.plist
      properties:
        CFBundleDisplayName: GitKittie Mail
        CFBundleName: GitKittie Mail
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © Sil van Diepen"

  # The app model against a real store in a temporary folder. The model's sources are built
  # into the bundle, so the tests run without launching the app.
  GitMailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GitMail/Models
      - path: Tests
    dependencies:
      - package: GitKittieMailKit
        product: MailCore
      - package: GitKittieMailKit
        product: MailStore
      - package: GitKittieMailKit
        product: MailMIME
      - package: GitKittieMailKit
        product: MailCompose
      - package: GitKittieMailProviders
        product: MailProvider
      - package: GitKittieMailProviders
        product: MailOutbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitmail.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  GitMail:
    build:
      targets:
        GitMail: all
        GitMailTests: test
    test:
      targets:
        - GitMailTests
