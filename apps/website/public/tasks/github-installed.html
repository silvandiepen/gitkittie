<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>GitKittie Tasks is installed</title>
  <!--
    The "GitKittie Tasks" GitHub App's setup URL: GitHub sends people here after they
    install it on a repository. Tasks opened GitHub's page in a sign-in sheet that waits for
    gitkittie-tasks://, so passing the query on (installation_id, setup_action) closes the
    sheet and Tasks registers for instant review notifications.
    See apps/gitkanban-relay/docs/Push.md.
  -->
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #3b6fd8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1626; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #7aa2ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 32rem; padding: 24px 16px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>GitKittie Tasks is installed</h1>
    <p>New review requests on this repository now reach your devices the moment they are asked.</p>
    <a id="open" href="gitkittie-tasks://github-installed">Back to Tasks</a>
  </main>
  <script>
    const target = "gitkittie-tasks://github-installed" + window.location.search;
    document.getElementById("open").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
