<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Share cards, not a page of the site: `npm run og` opens this in headless Chrome and

    -->
    <title>GitKittie share cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="card"></div>
    <script type="module" src="/src/og/main.ts"></script>
  </body>
</html>
