name: GitKanban
options:
  bundleIdPrefix: app.hakobs
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: 8
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "38MGF83L2L"

packages:
  # The shared Swift engine both native apps depend on.
  GitKittieKit:
    path: ../../swift/GitKittieKit
  # Provider REST transport types used by the UI (GitRepository, OAuth session).
  git-pont:
    url: https://github.com/silvandiepen/git-pont.git
    branch: master
  # The shared GitKanban app layer (AppModel + provider transport), tested once.
  GitKanbanKit:
    path: ../../swift/GitKanbanKit

targets:
  GitKanban:
    type: application
    platform: macOS
    sources:
      - path: GitKanban
      # Views both apps draw the same way (the rendered Markdown page).
      - path: ../../swift/TasksUI
      # The colours and the "Update available" notice every GitKittie app shares.
      - path: ../../swift/GitKittieUI
      # The rendered, editable Markdown view's web runtime (from Lezin), kept as a folder.
      - path: ../../swift/RichEditorWeb
        type: folder
        buildPhase: resources
    dependencies:
      # "Update available" (swift/GitKittieUI/UpdateNotice.swift, GITKITTIE-094).
      - package: GitKittieKit
        product: AppStoreUpdates
      - package: GitKanbanKit
        product: GitKanbanKit
      - package: GitKittieKit
        product: GitKittieKit
      - package: git-pont
        product: GitPontCore
      # The `tasks` command-line tool ships inside the app (Contents/Helpers/tasks), so it is
      # always the version of the app that is installed. Agent Access ▸ Install Command-Line
      # Tool… links it into ~/.local/bin.
      - target: TasksCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitkanban
        # The app is called Tasks (Tasks.app, "Tasks" in the menu bar). The target, scheme and
        # Swift module keep the name GitKanban, and so does the bundle id.
        PRODUCT_NAME: Tasks
        PRODUCT_MODULE_NAME: GitKanban
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GitKanban/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitKanban/GitKanban.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: GitKanban/GitKanban.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Agent access: the app listens on 127.0.0.1 for agents on this Mac (MCPServer.swift).
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Instant review notifications through the relay (apps/gitkanban-relay/docs/Push.md).
        # Xcode signs App Store builds with "production" from the profile.
        com.apple.developer.aps-environment: development
        # A review request marked `notify: urgent` breaks through Focus.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: GitKanban/Info.plist
      properties:
        CFBundleDisplayName: Tasks
        CFBundleName: Tasks
        NSLocalNetworkUsageDescription: Tasks looks for folder servers on your network so you can add one without typing its address.
        NSBonjourServices:
          - _gitkanban._tcp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © Sil van Diepen"
        # `gitkittie-tasks://new?title=…&body=…` starts a new task (GitKittie Mail's Make Task,
        # GKM-033). It only fills in the new-task sheet; nothing is saved without Create.
        CFBundleURLTypes:
          - CFBundleURLName: app.hakobs.gitkanban.new-task
            CFBundleURLSchemes:
              - gitkittie-tasks
        # Images dragged onto the Dock icon (or Open With) become a new task (GITKITTIE-105).
        # Viewer + Alternate: Tasks accepts them but never becomes the default image app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.png
              - public.jpeg
              - public.heic
              - public.tiff
              - public.image

  # `tasks`, the command-line tool (swift/GitKanbanKit/Sources/TasksCLI + TasksCLIKit; also
  # `swift build --product tasks` there). Every executable in an App Store app must be
  # sandboxed: it gets its own container, may connect to the app on 127.0.0.1, and may read
  # (only) the app's AgentAccess folder, where the port and token are.
  TasksCLI:
    type: tool
    platform: macOS
    sources:
      - path: ../../swift/GitKanbanKit/Sources/TasksCLI
    dependencies:
      - package: GitKanbanKit
        product: TasksCLIKit
    settings:
      base:
        PRODUCT_NAME: tasks
        PRODUCT_MODULE_NAME: TasksCLI
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitkanban.tasks
        # A sandboxed tool needs a bundle id, so its Info.plist goes into the binary.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: GitKanban/TasksCLI-Info.plist
        CODE_SIGN_ENTITLEMENTS: GitKanban/TasksCLI.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    entitlements:
      path: GitKanban/TasksCLI.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Containers/app.hakobs.gitkanban/Data/Library/Application Support/app.hakobs.gitkanban/AgentAccess/
    info:
      path: GitKanban/TasksCLI-Info.plist
      properties:
        CFBundleIdentifier: app.hakobs.gitkanban.tasks
        CFBundleName: tasks
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

  # The real window (RootView and everything it shows) hosted offscreen against a real
  # folder board. The app's sources are built into the bundle, so the tests run without
  # launching the app or showing a window.
  GitKanbanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GitKanban
        excludes:
          - Info.plist
          - GitKanban.entitlements
          - TasksCLI-Info.plist
          - TasksCLI.entitlements
      - path: ../../swift/TasksUI
      - path: ../../swift/GitKittieUI
      - path: Tests
    dependencies:
      - package: GitKittieKit
        product: AppStoreUpdates
      - package: GitKanbanKit
        product: GitKanbanKit
      - package: GitKittieKit
        product: GitKittieKit
      - package: git-pont
        product: GitPontCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hakobs.gitkanban.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  GitKanban:
    build:
      targets:
        GitKanban: all
        GitKanbanTests: [test]
    test:
      targets:
        - GitKanbanTests
