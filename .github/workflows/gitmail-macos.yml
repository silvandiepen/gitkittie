name: GitKittie Mail macOS

on:
  pull_request:
    branches: [main, development]
    paths:
      - apps/gitmail-macos/**
      - swift/GitKittieMailKit/**
      - swift/GitKittieMailProviders/**
      - swift/GitKittieUI/**
      # The app model the iPhone app shares (MAIL-067), and the test helper.
      - swift/MailAppModel/**
      - swift/MailAppTestSupport/**
      - .github/workflows/gitmail-macos.yml
  push:
    branches: [main, development]
    paths:
      - apps/gitmail-macos/**
      - swift/GitKittieMailKit/**
      - swift/GitKittieMailProviders/**
      - swift/GitKittieUI/**
      # The app model the iPhone app shares (MAIL-067), and the test helper.
      - swift/MailAppModel/**
      - swift/MailAppTestSupport/**
      - .github/workflows/gitmail-macos.yml
  workflow_dispatch:

jobs:
  build-and-test:
    # Xcode 26 / Swift 6.2: GitKittieMailProviders (swift-nio-imap 0.5) needs macOS 15 and Swift 6.2.
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/gitmail-macos
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build without signing
        run: xcodebuild -project GitMail.xcodeproj -scheme GitMail -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test the app model
        run: zsh scripts/test.sh
