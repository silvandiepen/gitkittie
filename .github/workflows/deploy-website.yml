name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - packages/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/deploy-website.yml
  workflow_dispatch:
    inputs:
      inspect_gitfolder_oauth:
        description: Inspect the GitFolder OAuth client without deploying
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  inspect-oauth:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_gitfolder_oauth == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Read safe OAuth client metadata
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/oauth_clients/385b6b643b98a3889d570ae7688cb509" \
            | jq '{success, errors, result: (.result | {client_id, client_name, client_uri, client_uri_verification, redirect_uris, scopes, optional_scopes, visibility, token_endpoint_auth_method})}'

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.inspect_gitfolder_oauth != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/dist --project-name=gitkittie-web
