name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - packages/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/deploy-website.yml
  workflow_dispatch:
    inputs:
      verify_gitfolder_oauth_domain:
        description: Create the GitFolder OAuth publisher TXT record
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  verify-oauth-domain:
    if: ${{ inputs.verify_gitfolder_oauth_domain }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish OAuth domain verification TXT
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer ${CF_API_TOKEN}"
          zone_id="$(curl --fail-with-body --silent --show-error "${api}/zones?name=hakobs.com" -H "${auth}" | jq -r '.result[0].id // empty')"
          test -n "${zone_id}"
          name="gitkittie.hakobs.com"
          content="cloudflare_oauth_client_publisher=49058bdba263afe365b526d7ec4d98d9"
          existing_id="$(curl --fail-with-body --silent --show-error "${api}/zones/${zone_id}/dns_records?type=TXT&name=${name}" -H "${auth}" | jq -r '.result[0].id // empty')"
          payload="$(jq -n --arg name "${name}" --arg content "${content}" '{type:"TXT",name:$name,content:$content,ttl:1}')"
          if [[ -n "${existing_id}" ]]; then
            response="$(curl --fail-with-body --silent --show-error -X PUT "${api}/zones/${zone_id}/dns_records/${existing_id}" -H "${auth}" -H 'Content-Type: application/json' --data "${payload}")"
          else
            response="$(curl --fail-with-body --silent --show-error -X POST "${api}/zones/${zone_id}/dns_records" -H "${auth}" -H 'Content-Type: application/json' --data "${payload}")"
          fi
          jq '{success, errors, result: {id, type, name, content}}' <<<"${response}"
          test "$(jq -r '.success' <<<"${response}")" = true

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/dist --project-name=gitkittie-web
