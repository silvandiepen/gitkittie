name: Swift GitKittieKit

on:
  pull_request:
    branches: [main, development]
    paths:
      - swift/GitKittieKit/**
      - .github/workflows/swift-gitkit.yml
  push:
    branches: [main, development]
    paths:
      - swift/GitKittieKit/**
      - .github/workflows/swift-gitkit.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift/GitKittieKit
    steps:
      - uses: actions/checkout@v6
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
